[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cfb"
version = "0.1.0"
description = "College football player value (hierarchical Bayesian) and game prediction on CFBD data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "tenacity>=8.2",
    "polars>=1.0",
    "pyarrow>=15",
    "duckdb>=1.0",
    "numpyro>=0.15",
    "jax>=0.4.30",
    "arviz>=0.18",
    "lightgbm>=4.3",
    "scikit-learn>=1.4",
    "rapidfuzz>=3.6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cfb = "cfb.cli:main"

[tool.setuptools.packages.find]
include = ["cfb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
